<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tragamonedas - Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .logo h2 {
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-register {
            background: #4CAF50;
            color: white;
        }

        .btn-register:hover {
            background: #388E3C;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76,175,80,0.3);
        }

        .btn-back {
            background: #666;
            color: white;
        }

        .btn-back:hover {
            background: #555;
        }

        .error-message {
            color: #f44336;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            text-align: center;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <script src="config.js"></script>

    <div class="register-container">
        <div class="logo">
            <h1>🎰</h1>
            <h2>CREAR CUENTA</h2>
        </div>

        <div class="form-group">
            <label>Usuario</label>
            <input type="text" id="usuario" placeholder="Elegí un usuario">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="Elegí una contraseña">
        </div>

        <div class="form-group">
            <label>Confirmar Contraseña</label>
            <input type="password" id="confirm-password" placeholder="Repetí la contraseña">
        </div>

        <button class="btn btn-register" onclick="registrarUsuario()">✅ REGISTRARME</button>
        <button class="btn btn-back" onclick="volverLogin()">🔙 VOLVER</button>

        <div id="error" class="error-message"></div>
        <div id="success" class="success-message"></div>
    </div>

    <script>
        const API_URL = window.API_URL || 'http://localhost:3000/api';

        function volverLogin() {
            window.location.href = 'login.html';
        }

        async function registrarUsuario() {
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!usuario || !password || !confirmPassword) {
                errorDiv.textContent = 'Completá todos los campos';
                errorDiv.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Las contraseñas no coinciden';
                errorDiv.style.display = 'block';
                return;
            }

            if (password.length < 4) {
                errorDiv.textContent = 'La contraseña debe tener al menos 4 caracteres';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password, role: 'user' })
                });

                const data = await res.json();

                if (res.ok) {
                    successDiv.textContent = '✅ Cuenta creada correctamente. Redirigiendo...';
                    successDiv.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.error || 'Error al registrar';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Error de conexión';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
