<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 TRAGAMONEDAS CLÁSICO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0f0f 0%, #1a1f2f 50%, #2a1f1f 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Máquina tragamonedas */
        .slot-machine {
            max-width: 650px;
            width: 100%;
            background: linear-gradient(145deg, #8B0000, #5a0000);
            border-radius: 60px 60px 40px 40px;
            padding: 30px 25px 40px 25px;
            box-shadow: 0 30px 0 #2a0000, 0 20px 40px rgba(0,0,0,0.5);
            border: 3px solid gold;
        }

        /* Pantalla superior */
        .top-screen {
            background: linear-gradient(135deg, #1e2a3a, #2a3a4a);
            border-radius: 30px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 2px solid gold;
        }

        .player-name {
            color: gold;
            font-size: 16px;
            font-weight: bold;
        }

        .credits {
            background: #000;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid gold;
        }

        .credits span:first-child {
            color: gold;
        }

        .credits span:last-child {
            color: #0f0;
            font-size: 24px;
            font-weight: bold;
            margin-left: 10px;
        }

        .btn-recargar, .btn-logout {
            padding: 8px 20px;
            border-radius: 25px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-recargar {
            background: #4CAF50;
            color: white;
        }

        .btn-logout {
            background: #f44336;
            color: white;
        }

        /* Rodillos */
        .reels {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            background: linear-gradient(145deg, #4a3a1a, #2a1f0a);
            padding: 30px 20px;
            border-radius: 40px;
            border: 3px solid gold;
        }

        .reel {
            width: 110px;
            height: 130px;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 5px 0 #8B4513;
            border: 3px solid #8B4513;
            transition: all 0.05s linear;
        }

        .reel.spinning {
            animation: spin 0.08s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(360deg); }
        }

        /* Línea de pago */
        .payline {
            text-align: center;
            margin: -15px 0 20px 0;
        }

        .payline-line {
            display: inline-block;
            background: gold;
            padding: 5px 40px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 2px;
        }

        /* Panel de apuesta */
        .bet-panel {
            background: linear-gradient(145deg, #1a2632, #2c3e50);
            border-radius: 40px;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid gold;
        }

        .bet-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .bet-btn {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #2c3e50;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #b7950b;
            transition: all 0.1s;
        }

        .bet-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b7950b;
        }

        .bet-display {
            background: #000;
            padding: 10px 35px;
            border-radius: 40px;
            border: 2px solid gold;
        }

        .bet-display span {
            color: gold;
            font-size: 28px;
            font-weight: bold;
        }

        /* Botón principal GIRAR */
        .spin-btn {
            width: 100%;
            background: linear-gradient(45deg, #f1c40f, #f39c12, #e67e22);
            border: none;
            padding: 20px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            box-shadow: 0 10px 0 #b7950b;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .spin-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #b7950b;
        }

        .spin-btn:disabled {
            opacity: 0.6;
            transform: translateY(5px);
            cursor: not-allowed;
        }

        /* Apuestas rápidas */
        .quick-bets {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .quick-bet {
            background: #2c3e50;
            border: 2px solid gold;
            color: gold;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .quick-bet:hover {
            background: gold;
            color: #2c3e50;
        }

        /* Resultado */
        .result-area {
            background: rgba(0,0,0,0.6);
            border-radius: 30px;
            padding: 15px;
            text-align: center;
            color: gold;
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            border: 1px solid gold;
        }

        /* Estadísticas */
        .stats-area {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 8px;
            text-align: center;
            border: 1px solid gold;
        }

        .stat-label {
            font-size: 11px;
            color: #ccc;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: gold;
        }

        /* Historial */
        .history {
            max-height: 100px;
            overflow-y: auto;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            color: white;
            font-size: 13px;
        }

        .history-item.win {
            color: gold;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(135deg, #1e2a3a, #2a3a4a);
            border-radius: 40px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            border: 4px solid gold;
        }
        .pack-grid {
            display: grid;
            gap: 12px;
            margin: 20px 0;
        }
        @media (min-width: 500px) { .pack-grid { grid-template-columns: repeat(2, 1fr); } }
        .pack {
            background: #2c3e50;
            border: 2px solid gold;
            border-radius: 25px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }
        .pack.selected { background: gold; color: #2c3e50; }
        .pack-monto { font-size: 22px; font-weight: bold; }
        .btn-modal { width: 100%; padding: 12px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-comprar { background: #4CAF50; color: white; }
        .btn-cerrar { background: #f44336; color: white; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
</head>
<body>
    <script src="config.js"></script>

    <div class="modal-overlay" id="modal-recarga">
        <div class="modal-content">
            <h2 style="color: gold; text-align: center;">💰 COMPRAR MONEDAS</h2>
            <div class="pack-grid">
                <div class="pack" onclick="seleccionarPack(5000, 5000)"><div class="pack-monto">🪙 5.000</div><div>₲ 5.000</div></div>
                <div class="pack" onclick="seleccionarPack(10000, 10000)"><div class="pack-monto">🪙 10.000</div><div>₲ 10.000</div></div>
                <div class="pack" onclick="seleccionarPack(25000, 25000)"><div class="pack-monto">🪙 25.000</div><div>₲ 25.000</div></div>
                <div class="pack" onclick="seleccionarPack(50000, 50000)"><div class="pack-monto">🪙 50.000</div><div>₲ 50.000</div></div>
            </div>
            <div style="background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; margin: 15px 0; text-align: center;">
                <p style="color: gold;">📲 Transferí al alias:</p>
                <p style="font-size: 32px; font-weight: bold; color: gold;">6018795</p>
                <button onclick="copiarAlias()" class="btn-modal" style="background: #2196F3;">📋 COPIAR ALIAS</button>
            </div>
            <button onclick="confirmarCompra()" class="btn-modal btn-comprar" id="btn-comprar" disabled>✅ SOLICITAR RECARGA</button>
            <button onclick="cerrarModal()" class="btn-modal btn-cerrar">❌ CANCELAR</button>
        </div>
    </div>

    <div class="slot-machine">
        <div class="top-screen">
            <span class="player-name">👤 <span id="player-name">Cargando...</span></span>
            <div class="credits">
                <span>🪙</span>
                <span id="credits">0</span>
            </div>
            <div>
                <button class="btn-recargar" onclick="abrirModalRecarga()">➕ RECARGAR</button>
                <button class="btn-logout" onclick="cerrarSesion()">🚪 SALIR</button>
            </div>
        </div>

        <div class="reels">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍒</div>
            <div class="reel" id="reel3">🍒</div>
        </div>

        <div class="payline">
            <div class="payline-line">━━━━━━ LÍNEA CENTRAL ━━━━━━</div>
        </div>

        <div class="bet-panel">
            <div class="bet-control">
                <button class="bet-btn" onclick="cambiarApuesta(-500)">-</button>
                <div class="bet-display">
                    <span id="apuesta">500</span>
                </div>
                <button class="bet-btn" onclick="cambiarApuesta(500)">+</button>
                <button class="bet-btn" onclick="apuestaMaxima()">MAX</button>
            </div>

            <button class="spin-btn" onclick="girar()" id="spin-btn">
                🎰 GIRAR
            </button>

            <div class="quick-bets">
                <div class="quick-bet" onclick="setApuesta(500)">500</div>
                <div class="quick-bet" onclick="setApuesta(1000)">1.000</div>
                <div class="quick-bet" onclick="setApuesta(2000)">2.000</div>
                <div class="quick-bet" onclick="setApuesta(5000)">5.000</div>
            </div>
        </div>

        <div class="result-area" id="resultado">
            🎰 Presioná GIRAR para jugar
        </div>

        <div class="stats-area">
            <div class="stat-card"><div class="stat-label">JUGADAS</div><div class="stat-value" id="total-jugadas">0</div></div>
            <div class="stat-card"><div class="stat-label">MEJOR PREMIO</div><div class="stat-value" id="mejor-premio">0</div></div>
            <div class="stat-card"><div class="stat-label">GANANCIAS</div><div class="stat-value" id="ganancias">0</div></div>
            <div class="stat-card"><div class="stat-label">RETORNO</div><div class="stat-value" id="retorno">0%</div></div>
        </div>

        <div class="history" id="historial">
            <div class="history-item">Esperando jugadas...</div>
        </div>
    </div>

    <script>
        const API_URL = window.API_URL || 'http://localhost:3000/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        let usuarioActual = {};
        let saldo = 0;
        let apuesta = 500;
        let jugando = false;
        let packSeleccionado = null;
        let LIMITE_SECRETO = 50000;
        
        let stats = { jugadas: 0, mayorPremio: 0, gananciasTotales: 0, historial: [] };
        const simbolos = ['🍒', '💎', '7', '🍋', '🍊'];
        const premios = { '🍒🍒🍒':50, '💎💎💎':30, '777':20, '🍋🍋🍋':10, '🍊🍊🍊':5, '2iguales':1 };

        function formatoNumero(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        async function cargarUsuario() {
            try {
                const res = await fetch(`${API_URL}/usuario`, { headers: { 'Authorization': token } });
                const data = await res.json();
                usuarioActual = data.usuario;
                saldo = data.usuario.fichas || 0;
                document.getElementById('player-name').textContent = usuarioActual.usuario;
                document.getElementById('credits').textContent = formatoNumero(saldo);
                
                const limiteGuardado = localStorage.getItem('limite_secreto_admin');
                if (limiteGuardado) LIMITE_SECRETO = parseInt(limiteGuardado);
                
                const statsGuardadas = localStorage.getItem(`stats_${usuarioActual.id}`);
                if (statsGuardadas) { stats = JSON.parse(statsGuardadas); actualizarEstadisticas(); }
            } catch (error) { console.error('Error:', error); }
        }

        function actualizarSaldo() {
            document.getElementById('credits').textContent = formatoNumero(saldo);
        }

        function cambiarApuesta(delta) {
            if (jugando) return;
            let nuevaApuesta = apuesta + delta;
            let maxApuesta = Math.min(50000, saldo);
            if (nuevaApuesta >= 500 && nuevaApuesta <= maxApuesta) {
                apuesta = nuevaApuesta;
                document.getElementById('apuesta').textContent = formatoNumero(apuesta);
            }
        }

        function setApuesta(valor) {
            if (jugando) return;
            if (valor <= saldo && valor >= 500 && valor <= 50000) {
                apuesta = valor;
                document.getElementById('apuesta').textContent = formatoNumero(apuesta);
            }
        }

        function apuestaMaxima() {
            if (jugando) return;
            apuesta = Math.min(50000, saldo);
            document.getElementById('apuesta').textContent = formatoNumero(apuesta);
        }

        function getRandomSimbolo() {
            return simbolos[Math.floor(Math.random() * simbolos.length)];
        }

        // Simular el giro de un rodillo con animación
        function animarRodillo(elemento, simboloFinal, callback) {
            let frames = 0;
            const maxFrames = 20;
            const intervalo = setInterval(() => {
                if (frames < maxFrames) {
                    elemento.textContent = getRandomSimbolo();
                    frames++;
                } else {
                    clearInterval(intervalo);
                    elemento.textContent = simboloFinal;
                    if (callback) callback();
                }
            }, 60);
        }

        async function girar() {
            if (jugando) return;
            let costoApuesta = apuesta;
            if (saldo < costoApuesta) {
                mostrarResultado('❌ Saldo insuficiente', 'error');
                abrirModalRecarga();
                return;
            }

            // Generar resultado ALEATORIO (RNG)
            const resultado = [
                getRandomSimbolo(),
                getRandomSimbolo(),
                getRandomSimbolo()
            ];
            
            let multiplicador = 0;
            if (resultado[0] === resultado[1] && resultado[1] === resultado[2]) {
                multiplicador = premios[resultado[0]+resultado[0]+resultado[0]] || 0;
            } else if (resultado[0] === resultado[1] || resultado[1] === resultado[2] || resultado[0] === resultado[2]) {
                multiplicador = premios['2iguales'];
            }
            let ganancia = apuesta * multiplicador;
            if (ganancia > LIMITE_SECRETO) ganancia = LIMITE_SECRETO;

            jugando = true;
            document.getElementById('spin-btn').disabled = true;
            
            // Restar saldo local
            saldo -= costoApuesta;
            actualizarSaldo();
            
            // Mostrar animación de giro
            const reel1 = document.getElementById('reel1');
            const reel2 = document.getElementById('reel2');
            const reel3 = document.getElementById('reel3');
            
            // Animar rodillos secuencialmente (como máquina real)
            animarRodillo(reel1, resultado[0], () => {
                animarRodillo(reel2, resultado[1], () => {
                    animarRodillo(reel3, resultado[2], async () => {
                        // Guardar resultado en backend
                        try {
                            const res = await fetch(`${API_URL}/jugar`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': token },
                                body: JSON.stringify({
                                    apuesta: costoApuesta,
                                    ganancia: ganancia,
                                    combinacion: `${resultado[0]}${resultado[1]}${resultado[2]}`
                                })
                            });
                            const data = await res.json();
                            saldo = data.nuevas_fichas;
                            actualizarSaldo();
                        } catch (error) {
                            console.error('Error guardando:', error);
                            saldo += ganancia;
                            actualizarSaldo();
                        }
                        
                        if (ganancia > 0) {
                            stats.jugadas++;
                            stats.gananciasTotales += ganancia;
                            if (ganancia > stats.mayorPremio) stats.mayorPremio = ganancia;
                            stats.historial.unshift({ combinacion: `${resultado[0]}${resultado[1]}${resultado[2]}`, ganancia });
                            if (stats.historial.length > 10) stats.historial.pop();
                            mostrarResultado(`🎉 GANASTE 🪙 ${formatoNumero(ganancia)}! (x${multiplicador})`, 'win');
                            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                        } else {
                            stats.jugadas++;
                            mostrarResultado('😢 Mejor suerte la próxima', 'lose');
                        }
                        
                        actualizarEstadisticas();
                        guardarEstadisticas();
                        jugando = false;
                        document.getElementById('spin-btn').disabled = false;
                    });
                });
            });
        }

        function mostrarResultado(mensaje, tipo) {
            const div = document.getElementById('resultado');
            div.textContent = mensaje;
            if (tipo === 'win') div.style.animation = 'winPulse 0.5s infinite alternate';
            else div.style.animation = 'none';
        }

        function actualizarEstadisticas() {
            document.getElementById('total-jugadas').textContent = stats.jugadas;
            document.getElementById('mejor-premio').textContent = formatoNumero(stats.mayorPremio);
            document.getElementById('ganancias').textContent = formatoNumero(stats.gananciasTotales);
            const retorno = stats.jugadas > 0 ? Math.round((stats.gananciasTotales / (stats.jugadas * apuesta)) * 100) : 0;
            document.getElementById('retorno').textContent = retorno + '%';
            
            const historialDiv = document.getElementById('historial');
            if (stats.historial.length === 0) historialDiv.innerHTML = '<div class="history-item">Esperando jugadas...</div>';
            else historialDiv.innerHTML = stats.historial.map(h => `<div class="history-item ${h.ganancia > 0 ? 'win' : ''}"><span>${h.combinacion}</span><span>${h.ganancia > 0 ? '+🪙 ' + formatoNumero(h.ganancia) : '0'}</span></div>`).join('');
        }

        function guardarEstadisticas() {
            localStorage.setItem(`stats_${usuarioActual.id}`, JSON.stringify(stats));
        }

        // Sincronización cada 5 segundos
        async function sincronizarSaldo() {
            try {
                const res = await fetch(`${API_URL}/usuario`, { headers: { 'Authorization': token } });
                const data = await res.json();
                const nuevoSaldo = data.usuario.fichas || 0;
                if (nuevoSaldo !== saldo) {
                    saldo = nuevoSaldo;
                    actualizarSaldo();
                }
            } catch (error) { console.error('Error:', error); }
        }
        setInterval(sincronizarSaldo, 5000);

        // Modal
        function abrirModalRecarga() {
            packSeleccionado = null;
            document.getElementById('modal-recarga').style.display = 'flex';
            document.getElementById('btn-comprar').disabled = true;
            document.querySelectorAll('.pack').forEach(p => p.classList.remove('selected'));
        }
        function seleccionarPack(monto, precio) {
            packSeleccionado = { monto, precio };
            document.querySelectorAll('.pack').forEach(p => p.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            document.getElementById('btn-comprar').disabled = false;
        }
        function copiarAlias() { navigator.clipboard.writeText("6018795"); alert('✅ Alias copiado!'); }
        function cerrarModal() { document.getElementById('modal-recarga').style.display = 'none'; }
        async function confirmarCompra() {
            if (!packSeleccionado) return;
            try {
                const res = await fetch(`${API_URL}/recargas/solicitar`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ fichas: packSeleccionado.monto, monto: packSeleccionado.precio })
                });
                const data = await res.json();
                if (data.success) {
                    const mensaje = encodeURIComponent(`💰 SOLICITUD DE RECARGA:\n• Usuario: ${usuarioActual.usuario}\n• Monedas: 🪙 ${formatoNumero(packSeleccionado.monto)}\n• A pagar: ₲ ${formatoNumero(packSeleccionado.precio)}`);
                    window.open(`https://wa.me/595983775018?text=${mensaje}`, '_blank');
                    alert('✅ Solicitud enviada');
                    cerrarModal();
                } else alert('Error: ' + (data.error || 'Error al enviar'));
            } catch (error) { alert('Error de conexión'); }
        }
        function cerrarSesion() { localStorage.removeItem('token'); localStorage.removeItem('usuario'); window.location.href = 'login.html'; }

        document.getElementById('modal-recarga').addEventListener('click', function(e) { if (e.target === this) cerrarModal(); });
        cargarUsuario();
    </script>
</body>
</html>
