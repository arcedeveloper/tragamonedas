<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 FRUIT KING - Tragamonedas Clásico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a0f0a 0%, #0a0503 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Courier New', 'Segoe UI', 'Arial', monospace;
        }

        /* MÁQUINA PRINCIPAL - ESTILO CLÁSICO LATINO */
        .slot-machine {
            max-width: 650px;
            width: 100%;
            background: linear-gradient(145deg, #c92a0a, #8b1a00);
            border-radius: 60px 60px 40px 40px;
            padding: 25px 20px 30px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.3),
                0 0 0 8px #ffd966,
                0 0 0 12px #b85c1a;
            position: relative;
        }

        /* PANEL SUPERIOR - PREMIOS Y CRÉDITOS */
        .top-panel {
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 5px 10px rgba(0,0,0,0.3);
            border: 2px solid #ffd966;
        }

        .prize-box, .credits-box {
            flex: 1;
            text-align: center;
            background: #000000aa;
            border-radius: 15px;
            padding: 10px;
            backdrop-filter: blur(4px);
        }

        .prize-box label, .credits-box label {
            display: block;
            font-size: 14px;
            color: #ffd966;
            letter-spacing: 2px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .prize-box .value, .credits-box .value {
            font-size: 42px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000, 2px 2px 0 #000;
            font-family: monospace;
            background: #000;
            padding: 5px 15px;
            border-radius: 10px;
            display: inline-block;
            letter-spacing: 3px;
        }

        .credits-box .value {
            color: #ffd966;
            text-shadow: 0 0 10px #ffaa00;
        }

        /* RODILLOS */
        .reels-container {
            background: linear-gradient(145deg, #3a2a1a, #2a1a0a);
            border-radius: 40px;
            padding: 30px 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.4);
            border: 3px solid #ffaa33;
        }

        .reels {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .reel {
            width: 110px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #fff, #ddd);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            box-shadow: 
                inset 0 0 0 3px #ffaa33,
                inset 0 0 0 8px #fff8,
                0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            background-color: #f9f2e0;
        }

        .reel.spinning {
            animation: reelShake 0.08s infinite;
        }

        @keyframes reelShake {
            0% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(2deg); }
            75% { transform: translateY(5px) rotate(-2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* BOTONES DE APUESTA RÁPIDA - ESTILO LATINO */
        .bet-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .bet-btn {
            background: radial-gradient(ellipse at center, #ffcc44, #ff9900);
            border: none;
            color: #2c1a0a;
            font-size: 24px;
            font-weight: bold;
            width: 70px;
            height: 60px;
            border-radius: 20px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            box-shadow: 0 6px 0 #aa5e00;
            transition: 0.05s linear;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
        }

        .bet-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #aa5e00;
        }

        .bet-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        /* BOTÓN 1:1 ESPECIAL */
        .btn-one-one {
            background: radial-gradient(ellipse at center, #ff6666, #cc3333);
            width: 90px;
            color: white;
            text-shadow: 2px 2px 0 #8b0000;
            box-shadow: 0 6px 0 #8b0000;
        }

        /* APUESTA ACTUAL */
        .current-bet {
            text-align: center;
            margin: 15px 0;
            background: #2a1a0a;
            padding: 10px;
            border-radius: 50px;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
        }

        .current-bet span {
            color: #ffd966;
            font-size: 28px;
            font-weight: bold;
            background: #000;
            padding: 5px 20px;
            border-radius: 30px;
            font-family: monospace;
        }

        /* BOTÓN GIRAR GRANDE */
        .spin-btn {
            width: 100%;
            background: radial-gradient(ellipse at center, #ff5555, #cc0000);
            border: none;
            padding: 20px;
            font-size: 36px;
            font-weight: bold;
            color: gold;
            text-shadow: 3px 3px 0 #8b0000;
            border-radius: 60px;
            cursor: pointer;
            margin: 15px 0;
            font-family: monospace;
            letter-spacing: 4px;
            box-shadow: 0 12px 0 #8b0000;
            transition: 0.05s linear;
        }

        .spin-btn:active {
            transform: translateY(6px);
            box-shadow: 0 6px 0 #8b0000;
        }

        .spin-btn:disabled {
            opacity: 0.7;
            transform: translateY(6px);
            cursor: not-allowed;
        }

        /* TABLA DE PREMIOS */
        .paytable {
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border-radius: 30px;
            padding: 15px;
            margin: 20px 0;
            border: 3px solid #ffaa33;
        }

        .paytable h3 {
            color: #ffaa33;
            text-align: center;
            margin-bottom: 15px;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .paytable-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .pay-item {
            display: flex;
            justify-content: space-between;
            background: #000000aa;
            padding: 8px 15px;
            border-radius: 30px;
            color: white;
            font-size: 18px;
        }

        .pay-item .symbols {
            font-size: 22px;
            letter-spacing: 4px;
        }

        .pay-item .multiplier {
            color: #ffaa33;
            font-weight: bold;
        }

        /* RESULTADO */
        .result-area {
            background: #000000cc;
            border-radius: 30px;
            padding: 15px;
            text-align: center;
            color: #ffaa33;
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
            border: 2px solid #ffaa33;
            font-family: monospace;
        }

        .result-area.win {
            animation: winFlash 0.3s infinite alternate;
        }

        @keyframes winFlash {
            from { background: #000000cc; border-color: #ffaa33; text-shadow: none; }
            to { background: #ffaa33cc; border-color: #fff; color: #fff; text-shadow: 0 0 10px red; }
        }

        /* INFO USUARIO */
        .user-info-bar {
            background: #2c2c2c;
            border-radius: 40px;
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 2px solid #ffaa33;
        }

        .user-name {
            color: #ffaa33;
            font-weight: bold;
            font-size: 16px;
        }

        .recargar-btn, .salir-btn {
            background: #ffaa33;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
        }

        .salir-btn {
            background: #cc3333;
            color: white;
        }

        /* MODAL */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border-radius: 40px;
            padding: 30px;
            border: 4px solid #ffaa33;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-content h2 {
            color: #ffaa33;
            margin-bottom: 20px;
        }

        .pack {
            background: #3a3a3a;
            margin: 10px 0;
            padding: 15px;
            border-radius: 30px;
            cursor: pointer;
            color: white;
            border: 2px solid #ffaa33;
        }

        .pack.selected {
            background: #ffaa33;
            color: #2a2a2a;
        }

        .alias {
            background: #000;
            padding: 15px;
            border-radius: 20px;
            font-size: 28px;
            font-family: monospace;
            margin: 15px 0;
            color: #ffaa33;
        }

        button {
            cursor: pointer;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
</head>
<body>
    <div class="slot-machine">
        <!-- BARRA USUARIO -->
        <div class="user-info-bar">
            <span class="user-name">👤 <span id="user-nombre">JUGADOR</span></span>
            <div>
                <button class="recargar-btn" onclick="abrirModal()">🪙 RECARGAR</button>
                <button class="salir-btn" onclick="cerrarSesion()">SALIR</button>
            </div>
        </div>

        <!-- PANEL PREMIOS Y CRÉDITOS -->
        <div class="top-panel">
            <div class="prize-box">
                <label>🏆 PREMIOS</label>
                <div class="value" id="ultimo-premio">0</div>
            </div>
            <div class="credits-box">
                <label>🎰 CRÉDITOS</label>
                <div class="value" id="creditos">0</div>
            </div>
        </div>

        <!-- RODILLOS -->
        <div class="reels-container">
            <div class="reels">
                <div class="reel" id="reel1">🍒</div>
                <div class="reel" id="reel2">🍒</div>
                <div class="reel" id="reel3">🍒</div>
            </div>
        </div>

        <!-- BOTONES DE APUESTA RÁPIDA (ESTILO LATINO) -->
        <div class="bet-buttons">
            <button class="bet-btn" onclick="setApuesta(5)">5</button>
            <button class="bet-btn" onclick="setApuesta(10)">10</button>
            <button class="bet-btn" onclick="setApuesta(15)">15</button>
            <button class="bet-btn" onclick="setApuesta(20)">20</button>
            <button class="bet-btn" onclick="setApuesta(30)">30</button>
            <button class="bet-btn" onclick="setApuesta(40)">40</button>
            <button class="bet-btn" onclick="setApuesta(100)">100</button>
            <button class="bet-btn btn-one-one" onclick="setApuesta(1)">1:1</button>
        </div>

        <!-- APUESTA ACTUAL -->
        <div style="text-align: center;">
            <div class="current-bet">
                <span>💰 APUESTA: <span id="apuesta-actual">1</span></span>
            </div>
        </div>

        <!-- BOTÓN GIRAR -->
        <button class="spin-btn" id="btn-girar" onclick="girar()">🎰 GIRAR</button>

        <!-- TABLA DE PREMIOS -->
        <div class="paytable">
            <h3>📋 TABLA DE PREMIOS</h3>
            <div class="paytable-grid">
                <div class="pay-item"><span class="symbols">🍒 🍒 🍒</span><span class="multiplier">x50</span></div>
                <div class="pay-item"><span class="symbols">💎 💎 💎</span><span class="multiplier">x30</span></div>
                <div class="pay-item"><span class="symbols">7 7 7</span><span class="multiplier">x20</span></div>
                <div class="pay-item"><span class="symbols">🍋 🍋 🍋</span><span class="multiplier">x10</span></div>
                <div class="pay-item"><span class="symbols">🍊 🍊 🍊</span><span class="multiplier">x5</span></div>
                <div class="pay-item"><span class="symbols">🎲 2 IGUALES</span><span class="multiplier">x1</span></div>
            </div>
        </div>

        <!-- ÁREA DE RESULTADO -->
        <div class="result-area" id="resultado">
            🎲 LISTO PARA JUGAR
        </div>
    </div>

    <!-- MODAL RECARGA -->
    <div class="modal" id="modal-recarga">
        <div class="modal-content">
            <h2>💰 COMPRAR CRÉDITOS</h2>
            <div class="pack" onclick="seleccionarPack(5000, 5000)">
                <strong>🪙 5.000 CRÉDITOS</strong><br>₲ 5.000
            </div>
            <div class="pack" onclick="seleccionarPack(10000, 10000)">
                <strong>🪙 10.000 CRÉDITOS</strong><br>₲ 10.000
            </div>
            <div class="pack" onclick="seleccionarPack(25000, 25000)">
                <strong>🪙 25.000 CRÉDITOS</strong><br>₲ 25.000
            </div>
            <div class="pack" onclick="seleccionarPack(50000, 50000)">
                <strong>🪙 50.000 CRÉDITOS</strong><br>₲ 50.000
            </div>
            <div class="alias">📲 ALIAS: 6018795</div>
            <button onclick="copiarAlias()" style="background:#ffaa33; border:none; padding:10px; border-radius:30px; margin:5px;">📋 COPIAR ALIAS</button>
            <button onclick="confirmarCompra()" id="btn-comprar" disabled style="background:#4CAF50; border:none; padding:10px; border-radius:30px; margin:5px; color:white;">✅ SOLICITAR</button>
            <button onclick="cerrarModal()" style="background:#cc3333; border:none; padding:10px; border-radius:30px; margin:5px; color:white;">❌ CERRAR</button>
        </div>
    </div>

    <script>
        // ========= CONFIGURACIÓN =========
        const API_URL = window.API_URL || 'http://localhost:3000/api';
        const token = sessionStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        let fichas = 0;
        let apuesta = 1;
        let jugando = false;
        let usuarioActual = {};
        let packSeleccionado = null;

        const simbolos = ['🍒', '💎', '7', '🍋', '🍊'];
        const premiosMap = {
            '🍒🍒🍒': 50,
            '💎💎💎': 30,
            '777': 20,
            '🍋🍋🍋': 10,
            '🍊🍊🍊': 5
        };

        function formatearNumero(n) {
            return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        async function cargarUsuario() {
            try {
                const res = await fetch(`${API_URL}/usuario`, { headers: { 'Authorization': token } });
                const data = await res.json();
                usuarioActual = data.usuario;
                fichas = data.usuario.fichas || 0;
                document.getElementById('user-nombre').textContent = usuarioActual.usuario;
                actualizarCreditos();
            } catch(e) { console.error(e); }
        }

        function actualizarCreditos() {
            document.getElementById('creditos').textContent = formatearNumero(fichas);
            document.getElementById('btn-girar').disabled = fichas < apuesta;
        }

        function setApuesta(valor) {
            if (jugando) return;
            if (valor <= fichas || valor === 1) {
                apuesta = valor;
                document.getElementById('apuesta-actual').textContent = apuesta;
                document.getElementById('btn-girar').disabled = fichas < apuesta;
            }
        }

        function calcularPremio(s1, s2, s3, apuestaVal) {
            if (s1 === s2 && s2 === s3) {
                let combo = s1 + s1 + s1;
                let mult = premiosMap[combo] || 0;
                return apuestaVal * mult;
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                return apuestaVal * 1;
            }
            return 0;
        }

        function animarRodillo(elemento, simboloFinal, callback) {
            let frames = 0;
            const maxFrames = 12;
            const interval = setInterval(() => {
                if (frames < maxFrames) {
                    elemento.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
                    frames++;
                } else {
                    clearInterval(interval);
                    elemento.textContent = simboloFinal;
                    if (callback) callback();
                }
            }, 60);
        }

        async function girar() {
            if (jugando) return;
            if (fichas < apuesta) {
                document.getElementById('resultado').textContent = '❌ CRÉDITOS INSUFICIENTES';
                abrirModal();
                return;
            }

            jugando = true;
            document.getElementById('btn-girar').disabled = true;

            // Resultado aleatorio
            const resultado = [
                simbolos[Math.floor(Math.random() * simbolos.length)],
                simbolos[Math.floor(Math.random() * simbolos.length)],
                simbolos[Math.floor(Math.random() * simbolos.length)]
            ];

            const ganancia = calcularPremio(resultado[0], resultado[1], resultado[2], apuesta);
            
            // Restar apuesta
            fichas -= apuesta;
            actualizarCreditos();

            const reel1 = document.getElementById('reel1');
            const reel2 = document.getElementById('reel2');
            const reel3 = document.getElementById('reel3');

            reel1.classList.add('spinning');
            reel2.classList.add('spinning');
            reel3.classList.add('spinning');

            animarRodillo(reel1, resultado[0], () => {
                animarRodillo(reel2, resultado[1], () => {
                    animarRodillo(reel3, resultado[2], async () => {
                        reel1.classList.remove('spinning');
                        reel2.classList.remove('spinning');
                        reel3.classList.remove('spinning');

                        // Guardar en backend
                        try {
                            const res = await fetch(`${API_URL}/jugar`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': token },
                                body: JSON.stringify({
                                    apuesta: apuesta,
                                    ganancia: ganancia,
                                    combinacion: `${resultado[0]}${resultado[1]}${resultado[2]}`
                                })
                            });
                            const data = await res.json();
                            fichas = data.nuevas_fichas;
                        } catch(e) {
                            fichas += ganancia;
                        }
                        
                        actualizarCreditos();
                        
                        const resultadoDiv = document.getElementById('resultado');
                        const premioDiv = document.getElementById('ultimo-premio');
                        
                        if (ganancia > 0) {
                            fichas += ganancia;
                            actualizarCreditos();
                            resultadoDiv.textContent = `🎉 GANASTE ${formatearNumero(ganancia)} CRÉDITOS! 🎉`;
                            resultadoDiv.classList.add('win');
                            premioDiv.textContent = formatearNumero(ganancia);
                            if (ganancia >= 1000) {
                                canvasConfetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
                            }
                            setTimeout(() => resultadoDiv.classList.remove('win'), 1000);
                        } else {
                            resultadoDiv.textContent = '😢 SIN SUERTE... ¡SEGUÍ JUGANDO!';
                            resultadoDiv.classList.remove('win');
                            premioDiv.textContent = '0';
                        }
                        
                        jugando = false;
                        document.getElementById('btn-girar').disabled = fichas < apuesta;
                    });
                });
            });
        }

        // MODAL RECARGA
        function abrirModal() {
            packSeleccionado = null;
            document.getElementById('modal-recarga').style.display = 'flex';
            document.getElementById('btn-comprar').disabled = true;
            document.querySelectorAll('.pack').forEach(p => p.classList.remove('selected'));
        }
        function seleccionarPack(fichas, precio) {
            packSeleccionado = { fichas, precio };
            document.querySelectorAll('.pack').forEach(p => p.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            document.getElementById('btn-comprar').disabled = false;
        }
        function copiarAlias() {
            navigator.clipboard.writeText("6018795");
            alert('✅ Alias copiado: 6018795');
        }
        function cerrarModal() {
            document.getElementById('modal-recarga').style.display = 'none';
        }
        async function confirmarCompra() {
            if (!packSeleccionado) return;
            const btn = document.getElementById('btn-comprar');
            btn.disabled = true;
            btn.textContent = "⏳ ENVIANDO...";
            try {
                const res = await fetch(`${API_URL}/recargas/solicitar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ fichas: packSeleccionado.fichas, monto: packSeleccionado.precio })
                });
                const data = await res.json();
                if (data.success) {
                    const msg = encodeURIComponent(`💰 SOLICITUD RECARGA\nUsuario: ${usuarioActual.usuario}\nPack: ${packSeleccionado.fichas} créditos\nMonto: ₲ ${packSeleccionado.precio}\n\nYa realicé la transferencia al alias 6018795. Gracias!`);
                    window.open(`https://wa.me/595983775018?text=${msg}`, '_blank');
                    alert('✅ Solicitud enviada por WhatsApp');
                    cerrarModal();
                } else {
                    alert('Error: ' + (data.error || 'No se pudo enviar'));
                }
            } catch(e) {
                alert('Error de conexión');
            }
            btn.disabled = false;
            btn.textContent = "✅ SOLICITAR";
        }
        function cerrarSesion() {
            sessionStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        cargarUsuario();
    </script>
</body>
</html>
