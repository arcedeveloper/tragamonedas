<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tragamonedas - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .logo h2 {
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-login {
            background: #4CAF50;
            color: white;
        }

        .btn-login:hover {
            background: #388E3C;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76,175,80,0.3);
        }

        .btn-register {
            background: #2196F3;
            color: white;
        }

        .btn-register:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }

        .error-message {
            color: #f44336;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .separator {
            text-align: center;
            margin: 20px 0;
            color: #666;
            position: relative;
        }

        .separator::before,
        .separator::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #ddd;
        }

        .separator::before { left: 0; }
        .separator::after { right: 0; }
    </style>
</head>
<body>
    <script src="config.js"></script>

    <div class="login-container">
        <div class="logo">
            <h1>🎰</h1>
            <h2>TRAGAMONEDAS</h2>
        </div>

        <div class="form-group">
            <label>Usuario</label>
            <input type="text" id="usuario" placeholder="Ingresá tu usuario">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="Ingresá tu contraseña">
        </div>

        <button class="btn btn-login" onclick="iniciarSesion()">🔐 INGRESAR</button>
        
        <div class="separator">o</div>
        
        <button class="btn btn-register" onclick="irRegistro()">📝 CREAR CUENTA</button>

        <div id="error" class="error-message"></div>
    </div>

    <script>
        const API_URL = window.API_URL || 'http://localhost:3000/api';

        function irRegistro() {
            window.location.href = 'register.html';
        }

        async function iniciarSesion() {
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            if (!usuario || !password) {
                errorDiv.textContent = 'Completá todos los campos';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    
                    if (data.usuario.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    errorDiv.textContent = data.error || 'Error al iniciar sesión';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Error de conexión';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
