<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tragamonedas - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .logo h2 {
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .toggle-password:hover {
            opacity: 1;
        }

        .eye-icon {
            width: 22px;
            height: 22px;
            stroke: #555;
            stroke-width: 2;
            fill: none;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-login .timer {
            font-size: 14px;
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 20px;
            display: none;
        }

        .register-link {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .register-link a {
            color: #2196F3;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #f44336;
            text-align: center;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <script src="config.js"></script>

    <div class="login-container">
        <div class="logo">
            <h1>🎰</h1>
            <h2>TRAGAMONEDAS</h2>
        </div>

        <div class="form-group">
            <label>Usuario</label>
            <input type="text" id="usuario" placeholder="Ingresá tu usuario">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Ingresá tu contraseña">
                <button class="toggle-password" onclick="togglePassword('password', this)" type="button">
                    <svg class="eye-icon" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <button class="btn-login" id="btn-login" onclick="iniciarSesion()">
            <span class="spinner"></span>
            <span class="btn-text">INGRESAR</span>
            <span class="timer"></span>
        </button>
        
        <div class="register-link">
            ¿No tenés cuenta? <a href="register.html">Registrate</a>
        </div>

        <div id="error" class="error-message"></div>
    </div>

    <script>
        const API_URL = window.API_URL || 'http://localhost:3000/api';

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const svg = button.querySelector('svg');
            
            if (input.type === 'password') {
                input.type = 'text';
                svg.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                input.type = 'password';
                svg.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        async function iniciarSesion() {
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = document.getElementById('btn-login');
            const spinner = btn.querySelector('.spinner');
            const timerSpan = btn.querySelector('.timer');
            const btnText = btn.querySelector('.btn-text');

            if (!usuario || !password) {
                errorDiv.textContent = 'Completá todos los campos';
                errorDiv.style.display = 'block';
                return;
            }

            // Mostrar indicador de carga
            errorDiv.style.display = 'none';
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'CONECTANDO...';
            
            // Contador de tiempo
            let segundos = 0;
            timerSpan.style.display = 'inline-block';
            const intervaloContador = setInterval(() => {
                segundos++;
                timerSpan.textContent = `${segundos}s`;
            }, 1000);

            try {
                const inicio = Date.now();
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const tiempoRespuesta = Date.now() - inicio;
                console.log(`⏱️ Tiempo de respuesta: ${tiempoRespuesta}ms`);

                const data = await res.json();

                clearInterval(intervaloContador);

                if (res.ok) {
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('usuario', JSON.stringify(data.usuario));
                    
                    if (data.usuario.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'INGRESAR';
                    timerSpan.style.display = 'none';
                    errorDiv.textContent = data.error || 'Error al iniciar sesión';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                clearInterval(intervaloContador);
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'INGRESAR';
                timerSpan.style.display = 'none';
                errorDiv.textContent = 'Error de conexión. El servidor puede estar despertando, intentá de nuevo.';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
