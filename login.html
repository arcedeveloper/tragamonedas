<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tragamonedas - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .logo h2 {
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .toggle-password:hover {
            opacity: 1;
        }

        .eye-icon {
            width: 22px;
            height: 22px;
            stroke: #555;
            stroke-width: 2;
            fill: none;
        }

        /* ===== BOTONES REDISEÑADOS ===== */
        .btn {
            width: 100%;
            padding: 0;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px 20px;
            width: 100%;
            height: 100%;
            transition: transform 0.2s ease;
        }

        .btn-icon {
            font-size: 20px;
            transition: transform 0.2s ease;
        }

        .btn-text {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Botón Login - gradiente brillante */
        .btn-login {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
            position: relative;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(76, 175, 80, 0.4);
        }

        .btn-login:active {
            transform: translateY(1px);
            box-shadow: 0 6px 12px rgba(76, 175, 80, 0.3);
        }

        /* Botón Registrar - efecto vidrio + borde neón */
        .btn-register {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3);
            position: relative;
            backdrop-filter: blur(2px);
        }

        .btn-register::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 2px;
            background: linear-gradient(135deg, #64b5f6, #ffd54f);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .btn-register:hover::after {
            opacity: 1;
        }

        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(33, 150, 243, 0.4);
            background: linear-gradient(135deg, #2a5298, #1e3c72);
        }

        .btn-register:active {
            transform: translateY(1px);
        }

        /* Efecto ripple para ambos botones */
        .btn {
            position: relative;
            overflow: hidden;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Separador mejorado */
        .separator {
            text-align: center;
            margin: 24px 0 20px;
            color: #888;
            position: relative;
            font-size: 14px;
            font-weight: 500;
        }

        .separator::before,
        .separator::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ddd, transparent);
        }

        .separator::before {
            left: 0;
            background: linear-gradient(90deg, transparent, #ddd);
        }

        .separator::after {
            right: 0;
            background: linear-gradient(90deg, #ddd, transparent);
        }

        .error-message {
            color: #f44336;
            text-align: center;
            margin-top: 16px;
            display: none;
            font-size: 14px;
            background: rgba(244, 67, 54, 0.1);
            padding: 10px;
            border-radius: 10px;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>
    <script src="config.js"></script>

    <div class="login-container">
        <div class="logo">
            <h1>🎰</h1>
            <h2>TRAGAMONEDAS</h2>
        </div>

        <div class="form-group">
            <label>👤 Usuario</label>
            <input type="text" id="usuario" placeholder="Ingresá tu usuario">
        </div>

        <div class="form-group">
            <label>🔒 Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Ingresá tu contraseña">
                <button class="toggle-password" onclick="togglePassword('password', this)" type="button">
                    <svg class="eye-icon" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Botón INGRESAR rediseñado -->
        <button class="btn btn-login" onclick="iniciarSesion()">
            <div class="btn-content">
                <span class="btn-icon">✨</span>
                <span class="btn-text">INGRESAR</span>
                <span class="btn-icon">🎰</span>
            </div>
        </button>
        
        <div class="separator">✦  continuar con  ✦</div>
        
        <!-- Botón CREAR CUENTA rediseñado -->
        <button class="btn btn-register" onclick="irRegistro()">
            <div class="btn-content">
                <span class="btn-icon">🌟</span>
                <span class="btn-text">CREAR CUENTA</span>
                <span class="btn-icon">🚀</span>
            </div>
        </button>

        <div id="error" class="error-message"></div>
    </div>

    <script>
        const API_URL = window.API_URL || 'http://localhost:3000/api';

        // Función para crear efecto ripple en los botones
        function createRipple(event, button) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            
            button.style.position = 'relative';
            button.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // Agregar efecto ripple a los botones (preservando funcionalidad original)
        const attachRippleToButtons = () => {
            const loginBtn = document.querySelector('.btn-login');
            const registerBtn = document.querySelector('.btn-register');
            
            if (loginBtn) {
                loginBtn.addEventListener('click', (e) => {
                    createRipple(e, loginBtn);
                    // Pequeño delay para no interferir con la función original
                    setTimeout(() => {
                        if (typeof iniciarSesion === 'function') {
                            // Prevenir doble ejecución si ya se llamó desde onclick
                            if (!loginBtn.hasAttribute('data-clicked')) {
                                loginBtn.setAttribute('data-clicked', 'true');
                                iniciarSesion();
                                setTimeout(() => loginBtn.removeAttribute('data-clicked'), 300);
                            }
                        }
                    }, 50);
                });
            }
            
            if (registerBtn) {
                registerBtn.addEventListener('click', (e) => {
                    createRipple(e, registerBtn);
                    setTimeout(() => {
                        if (typeof irRegistro === 'function') {
                            if (!registerBtn.hasAttribute('data-clicked')) {
                                registerBtn.setAttribute('data-clicked', 'true');
                                irRegistro();
                                setTimeout(() => registerBtn.removeAttribute('data-clicked'), 300);
                            }
                        }
                    }, 50);
                });
            }
        };

        // Mejorar togglePassword con animación sutil
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const svg = button.querySelector('svg');
            
            if (input.type === 'password') {
                input.type = 'text';
                svg.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
                button.style.transform = 'scale(0.95)';
                setTimeout(() => button.style.transform = '', 150);
            } else {
                input.type = 'password';
                svg.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
                button.style.transform = 'scale(0.95)';
                setTimeout(() => button.style.transform = '', 150);
            }
        }

        function irRegistro() {
            window.location.href = 'register.html';
        }

        async function iniciarSesion() {
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            if (!usuario || !password) {
                errorDiv.textContent = '⚠️ Completá todos los campos';
                errorDiv.style.display = 'block';
                // Animación de vibración suave en el contenedor del error
                errorDiv.style.transform = 'scale(1.02)';
                setTimeout(() => errorDiv.style.transform = '', 200);
                return;
            }

            try {
                // Mostrar feedback visual de carga en el botón
                const loginBtn = document.querySelector('.btn-login');
                const originalContent = loginBtn.innerHTML;
                loginBtn.innerHTML = `
                    <div class="btn-content">
                        <span class="btn-icon">⏳</span>
                        <span class="btn-text">INGRESANDO...</span>
                        <span class="btn-icon">🎰</span>
                    </div>
                `;
                loginBtn.style.opacity = '0.8';
                loginBtn.disabled = true;

                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await res.json();

                // Restaurar botón
                loginBtn.innerHTML = originalContent;
                loginBtn.style.opacity = '';
                loginBtn.disabled = false;

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    
                    // Animación de éxito antes de redirigir
                    errorDiv.style.display = 'none';
                    const container = document.querySelector('.login-container');
                    container.style.transform = 'scale(0.98)';
                    container.style.transition = 'transform 0.2s';
                    
                    setTimeout(() => {
                        if (data.usuario.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 200);
                } else {
                    errorDiv.textContent = data.error || '❌ Error al iniciar sesión';
                    errorDiv.style.display = 'block';
                    // Sacudir el contenedor del error para dar feedback
                    errorDiv.style.animation = 'shake 0.3s ease-in-out';
                    setTimeout(() => errorDiv.style.animation = '', 300);
                }
            } catch (error) {
                const loginBtn = document.querySelector('.btn-login');
                if (loginBtn) {
                    loginBtn.innerHTML = `
                        <div class="btn-content">
                            <span class="btn-icon">✨</span>
                            <span class="btn-text">INGRESAR</span>
                            <span class="btn-icon">🎰</span>
                        </div>
                    `;
                    loginBtn.style.opacity = '';
                    loginBtn.disabled = false;
                }
                errorDiv.textContent = '🔌 Error de conexión con el servidor';
                errorDiv.style.display = 'block';
                errorDiv.style.animation = 'shake 0.3s ease-in-out';
                setTimeout(() => errorDiv.style.animation = '', 300);
            }
        }

        // Agregar animación de shake al CSS dinámicamente
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
            .btn:active .btn-content {
                transform: scale(0.97);
            }
            .btn-login .btn-icon, .btn-register .btn-icon {
                transition: transform 0.2s ease;
            }
            .btn-login:hover .btn-icon, .btn-register:hover .btn-icon {
                transform: scale(1.1);
            }
            .login-container {
                transition: transform 0.2s ease;
            }
            .form-group input {
                transition: all 0.3s, transform 0.1s;
            }
            .form-group input:active {
                transform: scale(0.99);
            }
        `;
        document.head.appendChild(style);
        
        // Inicializar ripples cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            attachRippleToButtons();
            
            // Mejorar la experiencia de los inputs con feedback visual
            const inputs = document.querySelectorAll('.form-group input');
            inputs.forEach(input => {
                input.addEventListener('focus', (e) => {
                    e.target.parentElement.classList.add('input-focused');
                });
                input.addEventListener('blur', (e) => {
                    e.target.parentElement.classList.remove('input-focused');
                });
            });
        });
    </script>
</body>
</html>
